name: CEREBRON Farm 11 Chemistry Materials
on:
  push:
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          roles=[
          ["GENERAL_CHEMIST","general chemistry, stoichiometry, equilibria"],
          ["PHYSICAL_CHEMIST","thermodynamics, kinetics, statistical mechanics"],
          ["ORGANIC_CHEMIST","organic structure and reactivity"],
          ["INORGANIC_CHEMIST","inorganic and coordination chemistry"],
          ["CATALYSIS_SPECIALIST","catalysis and reaction pathways"],
          ["ELECTROCHEMISTRY_SPECIALIST","electrochemistry and interfaces"],
          ["CORROSION_SPECIALIST","corrosion, degradation, protection"],
          ["POLYMER_SCIENTIST","polymers, rheology, aging"],
          ["METALLURGIST","metals, alloys, phase transformations"],
          ["CERAMICS_SPECIALIST","ceramics and refractory materials"],
          ["COMPOSITES_SPECIALIST","composites and multiscale interfaces"],
          ["NANOMATERIALS_SPECIALIST","nanostructures and surface effects"],
          ["MATERIALS_CHARACTERIZATION","microscopy, spectroscopy, diffraction, metrology"],
          ["PROCESS_ENGINEER","scale-up, separations, process windows"],
          ["STRUCTURE_PROPERTY_ANALYST","structure-property-performance relations"],
          ["EXPERIMENT_DESIGNER","controls, reproducibility, decisive experiments"],
          ["SAFETY_AUDITOR","hazards, uncertainty, safe experimental framing"],
          ["RED_TEAM","attack assumptions, mechanisms and claimed performance"],
          ["REPLICATOR","independent reconstruction and validation plan"],
          ["SYNTHESIZER_JUDGE","merge evidence, classify established/derived/conjectural/speculative"]]
          models=["huggingface-projects/llama-3.2-3B-Instruct","huggingface-projects/gemma-2-9b-it"]
          inc=[]
          for i,(r,f) in enumerate(roles): inc.append({'role':r,'focus':f,'model':models[i%2]})
          print('matrix='+json.dumps({'include':inc}))
          PY
  agent:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet gradio_client
      - name: Execute chemistry materials agent
        env:
          ROLE: ${{ matrix.role }}
          FOCUS: ${{ matrix.focus }}
          MODEL: ${{ matrix.model }}
        run: python scripts/agent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-${{ matrix.role }}
          path: out/*.json
  omega-fusion:
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: all}
      - run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('all/**/*.json',recursive=True):
            try: rows.append(json.load(open(p)))
            except: pass
          ok=sum(x.get('status')=='SUCCESS' for x in rows)
          packet={'farm':'11-science-chemistry-materials','roles_seen':len(rows),'successful_external_ai_calls':ok,'status':'UNREVIEWED_EXTERNAL_AGENT_OUTPUT'}
          pathlib.Path('fusion').mkdir(); pathlib.Path('fusion/omega.json').write_text(json.dumps(packet,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chemistry-materials-omega-packet
          path: fusion/omega.json
